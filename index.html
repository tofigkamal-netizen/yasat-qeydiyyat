<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şəhid ailə tərkibi və əlilliyi olan şəxslər</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eff1ee;--sf:#ffffff;--sf2:#f6f7f5;--ink:#1b222a;--mut:#5d6872;--line:#dadfda;--line2:#c3c9c4;
  --act:#1d5a85;--act2:#164a6f;--acts:#e3ecf3;--on:#ffffff;
  --carn:#a52238;--carns:#f6e5e8;
  --ok:#2b7350;--oks:#e1efe6;--no:#a83636;--nos:#f6e3e3;--blk:#3a434d;--blks:#e5e8eb;
  --wrs:#fbf2d8;--wrl:#e6d18f;--wri:#5e4a0c;
  --sh:0 12px 32px rgba(20,28,36,.16);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13171b;--sf:#1b2025;--sf2:#22282e;--ink:#e5e9ec;--mut:#9aa5ae;--line:#2d343b;--line2:#3e464e;
  --act:#5c9fd0;--act2:#7db4dc;--acts:#1e3140;--on:#0e1317;
  --carn:#e06a7e;--carns:#3a1f26;
  --ok:#6cc398;--oks:#1b3328;--no:#e88585;--nos:#3b2222;--blk:#b9c2cb;--blks:#2a3037;
  --wrs:#322f1d;--wrl:#5c5227;--wri:#ecd98f;--sh:0 12px 32px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171b;--sf:#1b2025;--sf2:#22282e;--ink:#e5e9ec;--mut:#9aa5ae;--line:#2d343b;--line2:#3e464e;
  --act:#5c9fd0;--act2:#7db4dc;--acts:#1e3140;--on:#0e1317;
  --carn:#e06a7e;--carns:#3a1f26;
  --ok:#6cc398;--oks:#1b3328;--no:#e88585;--nos:#3b2222;--blk:#b9c2cb;--blks:#2a3037;
  --wrs:#322f1d;--wrl:#5c5227;--wri:#ecd98f;--sh:0 12px 32px rgba(0,0,0,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.45 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding:22px 20px 44px}

/* Başlıq */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:600 27px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.lede{color:var(--mut);margin:5px 0 0;font-size:14.5px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--act);background:var(--act);color:var(--on);border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:600;line-height:1.3}
.btn:hover{background:var(--act2);border-color:var(--act2)}
.btn.g{background:var(--sf);color:var(--ink);border-color:var(--line2);font-weight:500}
.btn.g:hover{background:var(--sf2)}
.btn svg{flex:none}

/* Siyahı paneli */
.panel{background:var(--sf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px;flex-wrap:wrap}
.srch{flex:1 1 300px;position:relative;max-width:520px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.srch input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line2);border-radius:6px;background:var(--sf2)}
.fbtn[aria-expanded="true"]{background:var(--acts);border-color:var(--act);color:var(--act)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--act);color:var(--on);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.badge:empty{display:none}
.cnt{margin-left:auto;color:var(--mut);font-size:14px;white-space:nowrap}
.cnt b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--acts);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:3px 4px 3px 11px;font-size:13.5px}
.chip button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:16px;line-height:1;color:var(--mut)}
.chip button:hover{background:var(--sf);color:var(--ink)}
.chip.clr{background:none;border-color:var(--line2);padding:3px 11px;cursor:pointer;color:var(--mut)}

/* Filtr paneli */
.fp{border-top:1px solid var(--line);background:var(--sf2);padding:18px 16px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:4px 32px;animation:drop .16s ease-out}
.fp[hidden]{display:none}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend{font:600 16px var(--serif);padding:0;margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--sf);flex-wrap:wrap}
.seg label{display:block;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;color:var(--ink);font-weight:500;border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--act);color:var(--on)}
.seg input:focus-visible+span{outline:2px solid var(--act);outline-offset:-3px}
.yr{display:flex;align-items:center;gap:8px}
.yr input{width:110px}
.fs.wide{grid-column:1/-1}
#fFin{min-height:70px;font-family:inherit}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pb{border:1px dashed var(--line2);background:var(--sf);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.pb:hover{border-style:solid;border-color:var(--act)}
.fpf{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin:4px -16px 0;padding:12px 16px;background:var(--sf)}
.fpf .sub{margin:0 auto 0 0;font-size:14px}

/* Cədvəl */
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
th{font-size:12.5px;font-weight:600;color:var(--mut);background:var(--sf2);white-space:nowrap}
tbody tr.g0 td{border-top:2px solid var(--line2)}
td.ld{vertical-align:top;background:var(--sf)}
tbody tr:hover td:not(.ld){background:var(--sf2)}
td.num{color:var(--mut);font-variant-numeric:tabular-nums;width:40px}
td.empty{padding:36px 16px;color:var(--mut);text-align:center}
.sub{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.sub.ok{color:var(--ok)}.sub.no{color:var(--no)}
.zero{color:var(--mut)}
.pc{font-weight:600;font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lnk:hover{color:var(--act);text-decoration-color:currentColor}
.nm{font-weight:600}
.cat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.cat i{width:9px;height:9px;border-radius:50%;flex:none}
.c-s i{background:var(--carn)}
.c-i i{border:2px solid var(--carn)}
.c-e i{background:var(--act);border-radius:2px}
.b{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;white-space:nowrap}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.Aktiv{background:var(--oks);color:var(--ok)}
.b.Deaktiv{background:var(--nos);color:var(--no)}
.b.Blok{background:var(--blks);color:var(--blk)}
.ps{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p1{background:var(--acts);color:var(--act)}.p2{background:var(--oks);color:var(--ok)}.p3{background:var(--wrs);color:var(--wri)}.p4{background:var(--blks);color:var(--blk)}
.dots{width:34px;height:34px;border:0;background:none;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--act)}
.dots:hover{background:var(--acts)}
#menu{position:fixed;display:none;background:var(--sf);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);min-width:170px;z-index:30;padding:4px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-radius:5px}
#menu button:hover{background:var(--sf2)}

/* Modal və formalar */
.ov{position:fixed;inset:0;background:rgba(10,14,18,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(30px,env(safe-area-inset-top,0px)) 12px 30px;z-index:40}
.md{background:var(--sf);border-radius:12px;width:min(640px,100%);padding:22px;box-shadow:var(--sh)}
.md h2,.pgh h2{font:600 21px/1.25 var(--serif);margin:0 0 4px}
.hi{list-style:none;margin:10px 0 0;padding:0}
.hi li{padding:10px 0;border-bottom:1px solid var(--line)}
.hi li:last-child{border-bottom:0}
.hi time{color:var(--mut);font-size:12.5px;display:block}
.hi .who{font-size:12.5px;font-weight:600;color:var(--act);margin-left:6px}
#fv{display:none}
.pgh{display:flex;align-items:center;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.pgh.pop{justify-content:space-between;margin:0}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--mut);padding:0 6px}
.frm{max-width:560px;margin:16px auto 0}
.fl{margin-bottom:14px}
.fl label,.fl .lb{display:block;margin-bottom:6px;color:var(--mut);font-size:13px;font-weight:600}
.fl input,.fl select,.fl textarea{width:100%;padding:8px 11px;background:var(--sf);border:1px solid var(--line2);border-radius:6px}
.fl textarea{min-height:64px;resize:vertical}
.fl input[readonly]{color:var(--mut);background:var(--sf2)}
.two{display:flex}.two input{border-radius:6px 0 0 6px}.two .yn{border-radius:0 6px 6px 0;padding:0 18px;white-space:nowrap}
.note{background:var(--wrs);border:1px solid var(--wrl);border-radius:6px;padding:9px 12px;margin-top:8px;font-size:14px}
.note.er{background:var(--nos);border-color:color-mix(in srgb,var(--no) 35%,transparent)}
.note.okb{background:var(--oks);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.full{width:100%;margin-top:8px;padding:11px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0}
.ico{border:0;background:none;color:var(--act);cursor:pointer;padding:6px;border-radius:6px;display:inline-grid;place-items:center}
.ico:hover{background:var(--acts)}

table.main{min-width:860px}
td.tg{width:44px;padding-right:0}
.chev{width:30px;height:30px;border:1px solid var(--line2);background:var(--sf);border-radius:6px;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink)}
.chev:hover{border-color:var(--act);color:var(--act)}
.chev svg{transition:transform .15s}
.chev[aria-expanded="true"]{background:var(--acts);border-color:var(--act);color:var(--act)}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
tr.pr.open td{border-bottom-color:transparent}
tr.cr td{background:var(--sf2);padding-top:8px;padding-bottom:8px}
tr.cr:last-of-type td,tr.cr+tr.pr td{border-top:0}
.ind{display:block;position:relative;padding-left:22px}
.ind::before{content:"";position:absolute;left:6px;top:-6px;width:10px;height:15px;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-bottom-left-radius:4px}
.tp td{vertical-align:top}
.tp td.ds{color:var(--mut);font-size:13.5px;max-width:460px}
.wi{display:block;margin-bottom:8px}.wi:last-child{margin-bottom:0}
/* Profil */
.crumb{font-size:14px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ph{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;gap:18px 28px;justify-content:space-between;flex-wrap:wrap}
.ph.mem{border-left:4px solid var(--carn)}
.kind{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);font-weight:600}
.pn{font:600 clamp(24px,3.2vw,34px)/1.15 var(--serif);margin:6px 0 4px;letter-spacing:-.01em}
.of{color:var(--mut);font-size:14.5px;margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 26px;margin:14px 0 0;max-width:820px}
.facts dt{font-size:12.5px;color:var(--mut)}
.facts dd{margin:3px 0 0;font-weight:600}
.facts .wide{grid-column:1/-1}
.pha{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.phm{flex:1 1 420px;min-width:0}
.sec{margin-top:28px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sech h3{font:600 20px var(--serif);margin:0}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.mc{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mc:hover{border-color:var(--act)}
.mc .rel{font-size:13px;color:var(--mut);font-weight:600}
.mc .lnk{font:600 17px/1.25 var(--serif);text-decoration:none;display:block;margin:4px 34px 6px 0}
.mc .lnk::after{content:"";position:absolute;inset:0;border-radius:10px}
.mc .ico{position:absolute;top:8px;right:8px;z-index:1}
.mc .meta{display:block;font-size:13.5px;color:var(--mut)}
.mc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:30px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--act)}
.tab .k{font-weight:500;margin-left:5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tp{background:var(--sf);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.tp .tw{border-top:0}
.tp table{min-width:680px}
.tpb{padding:12px 14px;display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)}
.tpe{padding:30px 16px;color:var(--mut);text-align:center}
.tph{padding:4px 16px 8px}

#bn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;max-width:min(640px,94vw);padding:10px 14px;border-radius:8px;gap:12px;align-items:center;box-shadow:var(--sh);display:none;border:1px solid}
#bn.ok{background:var(--oks);border-color:var(--ok);color:var(--ink)}
#bn.warn{background:var(--wrs);border-color:var(--wrl);color:var(--ink)}
#bn.er{background:var(--nos);border-color:var(--no);color:var(--ink)}
#bn button{border:0;background:none;font-size:20px;cursor:pointer;color:inherit}

@media (max-width:640px){
  .wrap{padding:16px 12px 36px}
  h1{font-size:22px}
  .cnt{margin-left:0;width:100%}
  .ph{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="lv" class="wrap">
  <div class="top">
    <h1>Şəhid ailə tərkibi və əlilliyi olan şəxslər</h1>
    <div class="acts"><button class="btn g" id="tf">Test FİN-ləri</button><button class="btn g" id="mu">Müraciətlər</button><button class="btn" id="nw">⊕ Yeni</button></div>
  </div>
  <div class="panel">
    <div class="bar">
      <div class="srch"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="FİN və ya ad, soyad ilə axtarın" aria-label="Axtarış"></div>
      <button class="btn g fbtn" id="fb" aria-expanded="false" aria-controls="fp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filtr<span class="badge" id="fbn"></span></button>
      <button class="btn g" id="xl" title="Cari nəticələri, ailə üzvləri ilə birlikdə Excel-ə ixrac edir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Excel ixrac</button>
      <div class="cnt">Nəticə<b id="cnt">0</b></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="fp" id="fp" hidden></div>
    <div class="tw"><table class="main">
      <thead><tr>
        <th><span class="vh">Ailə üzvlərini aç</span></th><th>#</th><th>Kateqoriya</th><th>Ad, soyad, ata adı</th><th>FİN</th><th>Qohumluq</th>
        <th>Cins</th><th>Doğum tarixi</th><th>Status</th><th><span class="vh">Əməliyyatlar</span></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </div>
</div>
<div id="fv" class="wrap"></div>
<div id="menu"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="bn"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ST=['Aktiv','Deaktiv','Blok'],ED='Əlilliyi olan şəxs',CATS=['Şəhid','İtkin',ED];
const REL=['Anası','Atası','Arvadı','Əri','Oğlu','Qızı','Qardaş','Bacı'];
const FIELDS=['ad','soyad','ata','fin','birth','addr'];
let uid=100;const OP='Aysel Məmmədova';
const mk=(id,rel,fin,asa,birth,status='Blok',x={})=>({id,rel,fin,asa,birth,status,hist:[{d:'12.09.2026 10:14',t:'Əlavə edildi. Qeyd: ilkin qeydiyyat'}],...x});
const sj=(id,type,fin,name,birth,status,members,x={})=>({id,type,fin,name,birth,status,...x,hist:[{d:'12.09.2026 10:14',t:'Əlavə edildi. Qeyd: ilkin qeydiyyat'}],members});
let S=[
 sj(1,'Şəhid','R4K7MZ2','ELÇİN HÜSEYNOV TAHİR OĞLU','','Aktiv',[
  mk(11,'Anası','A8N3PQK','GÜLNARƏ HÜSEYNOVA MƏZAHİR QIZI','12.03.1958','Aktiv'),
  mk(12,'Arvadı','B2T6WXM','SƏBİNƏ HÜSEYNOVA RAMİZ QIZI','05.09.1984','Blok',{applied:true}),
  mk(13,'Oğlu','C5J1LDR','EMİL HÜSEYNOV ELÇİN OĞLU','17.02.2008'),
  mk(14,'Qızı','D7V9HF3','AYLİN HÜSEYNOVA ELÇİN QIZI','22.11.2012','Deaktiv')]),
 sj(2,'Şəhid','F3M8QR6','RAUF MƏMMƏDLİ ƏLİ OĞLU','','Aktiv',[

let PROF=null,PT='l';
function openProfile(sid,mid,tab){
  const same=PROF&&PROF.sid===sid&&PROF.mid===mid;
  PROF={sid,mid};PT=tab||(same?PT:'l');
  const s=S.find(x=>x.id===sid),m=mid?s.members.find(x=>x.id===mid):null,o=m||s,root=isFam(s)&&!m;
  const pool=root?[s,...s.members]:[o];

  let facts;
  if(root)facts=fact('FİN',esc(s.fin))+fact('Kateqoriya',esc(s.type))+fact('Ailə üzvləri',`${s.members.length} nəfər`)+fact('Status',stCell(s,null))
    +fact('Ailə üzrə layihə',`${pjIds(pool).length}`)+fact('Ailə üzrə müraciət',`${pool.reduce((n,x)=>n+aOf(x.fin).length,0)}`);
  else facts=fact('FİN',esc(o.fin))+fact('Doğum tarixi',o.birth?`${o.birth} (${ageTxt(o.birth)})`:'—')+fact('Cins',gen(o)||'—')+fact('Status',stCell(s,m))
    +fact('Qeydiyyat ünvanı',esc(o.addr||'—'),1);
  const kind=m?`<span class="kind">${esc(m.rel)}</span>`:`<span class="kind">${catTag(s.type)}</span>`;
  const of=m?`<p class="of">${esc(s.type)}: <button class="lnk" data-p="${s.id}:0">${esc(s.name)}</button></p>`:'';
  const chk=!root&&o.chk?`<div class="note ${o.chk.ok?'okb':'er'}" style="max-width:820px">${o.chk.src} yoxlaması: ${esc(cap(o.chk.text))}.</div>`:'';

    ?`<button class="btn g" data-x="xl">${XLI}Excel ixrac</button><button class="btn g" data-x="ed">${pen}Redaktə</button><button class="btn" data-x="am">⊕ Ailə üzvü əlavə et</button>`
    :`<button class="btn g" data-x="xl">${XLI}Excel ixrac</button><button class="btn g" data-x="ed">${pen}Redaktə</button><button class="btn" data-x="mur">⊕ Müraciət əlavə et</button>`;
  let h=crumb+`<header class="ph${root?' mem':''}"><div class="phm">${kind}<h2 class="pn">${esc(nm)}</h2>${of}<dl class="facts">${facts}</dl>${chk}</div><div class="pha">${acts}</div></header>`;
  if(root){

      +(s.members.length?`<div class="mg">${s.members.map(x=>`<div class="mc"><span class="rel">${esc(x.rel)}</span><button class="lnk" data-p="${s.id}:${x.id}">${esc(x.asa)}</button>
        <span class="meta">${[gen(x),x.birth?`${x.birth}, ${ageTxt(x.birth)}`:''].filter(Boolean).join(', ')}</span><span class="meta">FİN ${esc(x.fin)}</span>
        <div class="ft">${stCell(s,x)}<span class="meta">${pOf(x.fin).length} layihə, ${aOf(x.fin).length} müraciət</span></div>

  const T=[['l','Layihələr',pjIds(pool).length],['m','Müraciətlər',pool.reduce((n,x)=>n+aOf(x.fin).length,0)],['h','Tarixçə',pool.reduce((n,x)=>n+x.hist.length,0)]];

const pjIds=pool=>[...new Set(pool.flatMap(x=>pOf(x.fin).map(p=>p.pid)))].sort((a,b)=>a-b);

  const pool=root?[s,...s.members]:[o],who=x=>x===s?`${s.type}: ${s.name}`:`${x.rel}: ${x.asa}`;

      :`<div class="tpe">${root?'Ailədən heç kim layihədə iştirak etməyib.':'Bu şəxs heç bir layihədə iştirak etməyib.'}</div>`;
  }else if(t==='m'){
    const rows=A.filter(a=>pool.some(x=>x.fin===a.fin)).sort((a,b)=>parseD(b.d)-parseD(a.d));
    h+=rows.length?tbl(['Tarix',...(root?['Müraciətçi']:[]),'İstiqamət','Növ','Əsas','Əməkdaş'],rows.map(a=>`<tr><td>${a.d}</td>${root?`<td>${esc(a.asa)}<span class="sub">${esc((pool.find(x=>x.fin===a.fin)||{}).rel||'')}</span></td>`:''}<td>${esc(a.ist)}</td><td>${esc(a.tip)}</td><td>${esc(a.basis)}</td><td>${esc(a.emp)}</td></tr>`).join(''))
      :`<div class="tpe">${root?'Ailə üzrə müraciət yoxdur.':'Bu şəxs üçün müraciət yoxdur. «Müraciət əlavə et» ilə yarada bilərsiniz.'}</div>`;
  }else{
    const ev=pool.flatMap(x=>x.hist.map(e=>({...e,w:root?who(x):''}))).sort((a,b)=>parseD(b.d)-parseD(a.d));
    h+=ev.length?`<ul class="hi tph">${ev.map(e=>`<li><time>${e.d}${e.w?`<span class="who">${esc(e.w)}</span>`:''}</time>${esc(e.t)}</li>`).join('')}</ul>`:'<div class="tpe">Tarixçə boşdur.</div>';
  }
  $('tp').innerHTML=h;
}

function drawEdit(){

  CTX={mem:!isS,ed:isS&&D.type===ED};const ruled=!(isS&&fam);   /* əlilliyi olan şəxs və ya ailə üzvü: aktivləşdirmə 1 dəfə, müraciətdən sonra Blok */
  const orig=isS?S.find(x=>x.id===D.id):S.find(x=>x.id===D.id).members.find(x=>x.id===P.id);

  h+=personFields(P);
  h+=`<div class="fl"><label for="st">Status</label><select id="st" ${lock?'disabled':''}>${opts(ST,P.status,noAkt?['Aktiv']:[])}</select>`;
  if(ruled&&P.chk)h+=`<div class="note ${P.chk.ok?'okb':'er'}">${P.chk.src} yoxlaması: ${cap(P.chk.text)}.</div>`;
  if(lock)h+=`<div class="note">${D.type} statusu <b>${D.status}</b> olduğu üçün üzvün statusunu dəyişmək olmur. Əvvəlcə ${lower(D.type)} Aktiv edilməlidir.</div>`;
  else if(noAkt)h+=`<div class="note er">Aktiv etmək yalnız 1 dəfə mümkündür və artıq istifadə olunub.</div>`;
  else if(ruled&&P.status==='Aktiv')h+=`<div class="note">Bildiriş: Aktiv etmək yalnız 1 dəfə mümkündür. Bir müraciət əlavə edildikdən sonra şəxs avtomatik <b>Blok</b> olacaq.</div>`;
  if(isS&&fam&&P.status!=='Aktiv'&&D.members.length)h+=`<div class="note">${D.type} statusu <b>${P.status}</b> olduqda bütün ailə üzvləri (${D.members.length}) də <b>${P.status}</b> görünəcək. Üzvlərin öz statusları dəyişmir, ${lower(D.type)} yenidən Aktiv edildikdə özlərinə qayıdır.</div>`;
  h+='</div>'+noteField()+'</div>';
  popup(h);wire(P,drawEdit);
  $('st').onchange=()=>{P.status=$('st').value;drawEdit()};
  $('sv').onclick=saveEdit;
}
function saveEdit(){
  const bad=[D,...D.members].find(o=>!o.ad.trim()||!o.soyad.trim()||o.fin.length!==7);
  if(bad)return err(`${bad===D?D.type:bad.rel}: ad, soyad və 7 simvollu FİN doldurulmalıdır.`);
  const s=S.find(x=>x.id===D.id),pairs=[[s,D],...D.members.map(dm=>[s.members.find(x=>x.id===dm.id),dm])];
  const ruled=o=>o!==s||!isFam(s),activating=(o,n)=>ruled(o)&&n.status==='Aktiv'&&o.status!=='Aktiv';
  const parts=pairs.map(([o,n])=>{
    const p=[];
    if(n.status!==o.status)p.push(`Status: ${o.status} → ${n.status}`+(activating(o,n)?' (bir dəfəlik aktivləşdirmə)':'')+(o===s&&isFam(s)&&n.status!=='Aktiv'&&s.members.length?` (${s.members.length} ailə üzvünə təsir edir)`:''));
    if(FIELDS.some(k=>o[k]!==n[k])||(n.rel!==undefined&&o.rel!==n.rel))p.push('Məlumatlar yeniləndi');
    return p;
  });
  if(!parts.some(p=>p.length))return err('Dəyişiklik edilməyib.');
  if(!note.trim())return err('Qeyd yazın. Dəyişiklik tarixçəyə qeydlə birlikdə yazılır.');
  const d=now();
  pairs.forEach(([o,n],i)=>{
    if(!parts[i].length)return;
    const oldFin=o.fin;
    o.hist.push({d,t:`${parts[i].join('; ')}. Qeyd: ${note.trim()}. Əməkdaş: ${OP}`});
    if(activating(o,n)){o.act=1;o.ovr=!(o.chk&&o.chk.ok)}
    FIELDS.forEach(k=>o[k]=n[k]);if(n.rel!==undefined)o.rel=n.rel;o.status=n.status;
    o[o===s?'name':'asa']=full(o);
    if(oldFin!==o.fin)PX.forEach(x=>{if(x.fin===oldFin)x.fin=o.fin});
  });
  closeForm();refresh();
}

/* Təkrar yoxlaması: eyni FİN yalnız digəri Deaktiv olduqda yenidən əlavə edilə bilər */
function dupCheck(kind,fin,rel){
  const hits=[];
  S.forEach(s=>{
    if(kind==='ed'&&s.type===ED&&s.fin===fin)hits.push({o:s,desc:ED});
    if(kind==='member')s.members.forEach(m=>{if(m.fin===fin)hits.push({o:m,desc:`${s.type} ${s.name} üzrə ${m.rel}`})});
  });
  if(!hits.length)return null;
  const bad=hits.find(x=>x.o.status!=='Deaktiv');
  if(bad)return {block:true,text:bad.o.status==='Aktiv'?`Əlavə edilə bilmir, çünki bu şəxs artıq ${bad.desc} kimi Aktiv statusda mövcuddur.`:`Əlavə edilə bilmir. Bu şəxs artıq ${bad.desc} kimi Blok statusunda mövcuddur. Yalnız Deaktiv olduqda təkrar əlavə etmək olar.`};
  return {block:false,text:`Bu şəxs artıq ${hits[0].desc} kimi mövcuddur, amma statusu Deaktivdir.`+(kind==='member'&&rel?` (${rel} kimi əlavə edirsiniz.)`:'')};
}

function saveNew(){
  const P=NW.p,mem=NW.sid!=null,ed=!mem&&NW.cat===ED,fam=!mem&&!ed;
  if(!P.ad.trim()||!P.soyad.trim()||P.fin.length!==7)return err(fam&&NW.mode==='bridge'?'Əvvəlcə 7 simvollu FİN yazıb «Bridge-dən yüklə» düyməsinə basın.':'Ad, soyad və 7 simvollu FİN doldurulmalıdır.');
  if(!note.trim())return err('Qeyd yazın. Əlavə edilmə tarixçəyə qeydlə birlikdə yazılır.');
  const dup=mem||ed?dupCheck(mem?'member':'ed',P.fin,P.rel):null;

    if(mem)Object.assign(rec,{asa:full(rec)});else{Object.assign(rec,{type:ED,name:full(rec),members:[]});delete rec.rel}
    (mem?S.find(x=>x.id===NW.sid).members:S).push(rec);
    banner(chk.ok?'ok':'warn',chk.ok?`${chk.src} yoxlaması uğurlu: ${cap(chk.text)}. Status: Blok.`:`${chk.src} yoxlaması: ${cap(chk.text)}. Müraciət yalnız statusu Aktiv edərkən əlavə edilə bilər.`);
  }
  closeForm();
  if(mem)openProfile(NW.sid,0);
  else{F={...F0};$('q').value='';if(!$('fp').hidden)drawPanel();changed()}
}

  o.hist.push({d,t:`Müraciət əlavə edildi. İstiqamət: ${MR.ist}. Növ: ${MR.tip}. Əsas: ${basis}${MR.go==='ovr'?' (1 dəfəlik icazə)':''}. Status → Blok (avtomatik). Əməkdaş: ${OP}.`});
  A.push({id:A.length+1,d,fin:o.fin,asa:m?m.asa:s.name,kind,ist:MR.ist,tip:MR.tip,basis,emp:OP});
  const who=murWho(s,m,o);
  if(MR.from)openProfile(MR.from.sid,MR.from.mid,'m');else drawMurList();
  popup(head('Müraciət əlavə edildi')+`<div class="note okb">${esc(who)}. ${esc(basis)}. İstiqamət: ${esc(MR.ist)}. Müraciət əlavə edildi, status avtomatik Blok oldu.</div><button class="btn g full" onclick="closeForm()">Bağla</button>`);

/* ===== Excel ixrac ===== */
const XLI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
async function saveXlsx(name,sheets){
  if(!window.XLSX)return banner('er','Excel modulu yüklənmədi. Səhifəni yeniləyib yenidən cəhd edin.');
  const wb=XLSX.utils.book_new();
  sheets.forEach(([t,rows])=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=rows[0].map((_,i)=>({wch:Math.min(60,Math.max(8,...rows.map(r=>String(r[i]??'').length))+2)}));
    if(rows.length>1)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:rows[0].length-1}})};
    XLSX.utils.book_append_sheet(wb,ws,t.slice(0,31));
  });
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'}),filename=`${name}_${stamp()}.xlsx`;
  if(window.claude&&typeof claude.use==='function'){
    const dl=await claude.use('downloads');
    if(!dl)return banner('er','Bu görünüşdə fayl yükləmək mümkün deyil. Səhifəni claude.ai-da açın.');
    try{await dl.save({filename,data:new Blob([buf])});banner('ok',`Excel faylı hazırdır: ${filename}`)}
    catch(e){if(e&&e.code==='declined')return;banner('er',e&&e.code==='rate_limited'?'Yükləmə pəncərəsi artıq açıqdır. Onu bağlayıb yenidən cəhd edin.':'Fayl yüklənmədi. Yenidən cəhd edin.')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
const AH=['Tarix','FİN','Ad, soyad, ata adı','Müraciətçi','İstiqamət','Növ','Əsas','Əməkdaş'],aRow=a=>[a.d,a.fin,a.asa,a.kind,a.ist,a.tip,a.basis,a.emp];
function exportList(){
  const rows=[['Kateqoriya','Şəhid / əlilliyi olan şəxs','Şəhid / əlilliyi olan şəxs FİN','Qohumluq','Ailə üzvü','Ailə üzvü FİN','Cins','Doğum tarixi','Yaş','Status','Layihələr','Müraciət sayı']];
  const pr=[['FİN','Ad, soyad, ata adı','Qohumluq','Şəhid / itkin','Layihə','Layihə istiqaməti']],ar=[AH],seen=new Set();
  groupsOf().forEach(({s,ms})=>ms.forEach(m=>{
    const o=m||s;
    rows.push([s.type,s.name,s.fin,m?m.rel:'',m?m.asa:'',m?m.fin:'',gen(o),o.birth,ageOf(o.birth)??'',eff(s,m),pOf(o.fin).map(x=>prj(x.pid).name).join('; '),aOf(o.fin).length]);
    if(seen.has(o.fin))return;seen.add(o.fin);
    pOf(o.fin).forEach(x=>pr.push([o.fin,m?m.asa:s.name,m?m.rel:s.type,isFam(s)?s.name:'',prj(x.pid).name,prj(x.pid).dir]));
    aOf(o.fin).forEach(a=>ar.push(aRow(a)));
  }));
  if(rows.length===1)return banner('warn','İxrac üçün nəticə yoxdur. Filtrləri dəyişin.');
  const sh=[['Siyahı',rows],['Layihələr',pr],['Müraciətlər',ar]];
  const miss=F.fins.filter(f=>!finExists(f));
  if(miss.length)sh.push(['Tapılmayan FİN-lər',[['FİN'],...miss.map(f=>[f])]]);
  saveXlsx(F.fins.length?'FIN_siyahisi':'Siyahi',sh);
}
function exportProfile(){
  const {s,m,o}=profObj(),root=isFam(s)&&!m,pool=root?[s,...s.members]:[o];
  const nm=x=>x===s?s.name:x.asa;
  const info=root
    ?[['Kateqoriya','Ad, soyad, ata adı','FİN','Qohumluq','Cins','Doğum tarixi','Yaş','Status','Layihə sayı','Müraciət sayı'],
      ...pool.map(x=>[s.type,nm(x),x.fin,x===s?s.type:x.rel,gen(x),x.birth,ageOf(x.birth)??'',x===s?s.status:eff(s,x),pOf(x.fin).length,aOf(x.fin).length])]
    :[['Sahə','Məlumat'],['Ad, soyad, ata adı',nm(o)],['FİN',o.fin],['Kateqoriya',s.type],...(m?[['Qohumluq',m.rel],[s.type,`${s.name} (${s.fin})`]]:[]),
      ['Cins',gen(o)],['Doğum tarixi',o.birth],['Yaş',ageOf(o.birth)??''],['Status',eff(s,m)],['Qeydiyyat ünvanı',o.addr],['Bridge yoxlaması',o.chk?cap(o.chk.text):'']];
  const pr=[['Layihə','Layihə istiqaməti','Detallı təsvir',...(root?['İştirakçılar']:[])],
    ...pjIds(pool).map(pid=>{const P=prj(pid);return [P.name,P.dir,P.desc,...(root?[pool.filter(x=>pOf(x.fin).some(p=>p.pid===pid)).map(x=>x===s?s.name:`${x.asa} (${x.rel})`).join('; ')]:[])]})];
  const ar=[AH,...A.filter(a=>pool.some(x=>x.fin===a.fin)).sort((a,b)=>parseD(b.d)-parseD(a.d)).map(aRow)];
  const hr=[['Tarix',...(root?['Şəxs']:[]),'Qeyd'],...pool.flatMap(x=>x.hist.map(e=>[e.d,...(root?[x===s?`${s.type}: ${s.name}`:`${x.rel}: ${x.asa}`]:[]),e.t])).sort((a,b)=>parseD(b[0])-parseD(a[0]))];
  saveXlsx((root?'Aile_':'Profil_')+o.fin,[[root?'Ailə üzvləri':'Məlumat',info],['Layihələr',pr],['Müraciətlər',ar],['Tarixçə',hr]]);
}
$('xl').onclick=exportList;
